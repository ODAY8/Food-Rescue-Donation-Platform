<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#40916c" />
    </linearGradient>

    <!-- Caring Hand / Heart Orange Gradient -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4a261" />
      <stop offset="100%" stop-color="#e76f51" />
    </linearGradient>

    <!-- Subtle Glow Shadow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base with Deep Forest Green -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Soft Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="#52b788" stroke-width="1.2" stroke-opacity="0.3" fill="none" />

  <g filter="url(#glow)">
    <!-- Caring Rescue Hand / Heart Cradle Base -->
    <path 
      d="M16 38 C 16 46, 26 51, 33 49 C 39 47.5, 46 43, 49 37 C 49.8 35.4, 48.2 33.8, 46.5 34.6 C 43.5 36, 38.5 38.5, 33 38 C 28 37.5, 23.5 34.5, 20.8 31.8 C 19.2 30.2, 16 31.5, 16 33.8 Z" 
      fill="url(#handGrad)" 
    />

    <!-- Upward Supporting Thumb/Arm Accent -->
    <path 
      d="M17.5 32 C 14.5 28, 16 23, 21 21 C 24 19.8, 27 21.5, 28.5 24 C 29.2 25.2, 28.2 26.8, 26.8 26.5 C 24 25.8, 21.5 27.2, 19.5 30 Z" 
      fill="url(#handGrad)" 
      opacity="0.9"
    />

    <!-- Main Rescued Leaf (Sprout of Life) -->
    <path 
      d="M32 12 C 43 14, 48 24, 46 34 C 41 37, 32 37, 28 32 C 26 29, 26.5 21, 32 12 Z" 
      fill="url(#leafGrad)" 
    />

    <!-- Secondary Fresh Sprout Leaf -->
    <path 
      d="M28 24 C 22 25, 20 31, 23 37 C 26 38, 30 36, 31 33 C 32 30, 31 26, 28 24 Z" 
      fill="#52b788" 
      opacity="0.85"
    />

    <!-- Leaf Center Stem / Vein (Fresh White Highlight) -->
    <path 
      d="M30 34 C 33 28, 37 21, 44 16" 
      stroke="#d8f3dc" 
      stroke-width="1.8" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      opacity="0.8"
    />
  </g>
</svg>